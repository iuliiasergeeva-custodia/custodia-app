services:
  - type: web
    name: custodia-web
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        fromService:
          type: web
          name: custodia-web
          property: port
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard (PostgreSQL connection string)
      - key: PYTHON_VERSION
        value: 3.11
    healthCheckPath: /api/health

