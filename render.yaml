services:
  - type: web
    name: custodia-web
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        fromService:
          type: web
          name: custodia-web
          property: port
      - key: EMAIL_USER
        sync: false  # Set manually in Render dashboard
      - key: EMAIL_PASS
        sync: false  # Set manually in Render dashboard
      - key: EMAIL_TEST_MODE
        value: "false"  # Set to "true" to disable email sending
    healthCheckPath: /api/health

