services:
  - type: web
    name: custodia-web
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        fromService:
          type: web
          name: custodia-web
          property: port
      - key: NODE_ENV
        value: production
      - key: EMAIL_USER
        sync: false  # Set manually in Render dashboard
      - key: EMAIL_PASS
        sync: false  # Set manually in Render dashboard
      - key: EMAIL_TEST_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: custodia-db
          property: connectionString
      - key: LOCATIONS_API_KEY
        value: abs123qwe
      - key: ADMIN_API_KEY
        value: abs123qwe
      - key: JWT_SECRET
        sync: false  # Set manually: long random string (e.g. openssl rand -hex 32)
      - key: APP_BASE_URL
        sync: false  # Set manually: https://your-domain.com (for password reset links)
      - key: ADMIN_KEY
        sync: false  # Set manually in Render dashboard (use your secure password)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false  # Set manually in Render dashboard (from Cloudinary account)
      - key: CLOUDINARY_API_KEY
        sync: false  # Set manually in Render dashboard (from Cloudinary account)
      - key: CLOUDINARY_API_SECRET
        sync: false  # Set manually in Render dashboard (from Cloudinary account)
    healthCheckPath: /api/health

  - type: worker
    name: custodia-tracker-simulator
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/scripts/scheduled_fake_tracker_data.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: custodia-db
          property: connectionString
      - key: LOCATIONS_API_KEY
        value: abs123qwe
      - key: RENDER_SERVICE_URL
        fromService:
          type: web
          name: custodia-web
          property: host
        transform: https://${host}

