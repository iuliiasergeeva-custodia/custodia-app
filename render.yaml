services:
  - type: web
    name: custodia-web
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        fromService:
          type: web
          name: custodia-web
          property: port
      - key: NODE_ENV
        value: production
      - key: EMAIL_USER
        sync: false  # Set manually in Render dashboard
      - key: EMAIL_PASS
        sync: false  # Set manually in Render dashboard
      - key: EMAIL_TEST_MODE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: custodia-db
          property: connectionString
      - key: LOCATIONS_API_KEY
        value: abs123qwe
      - key: ADMIN_API_KEY
        value: abs123qwe
    healthCheckPath: /api/health

  - type: worker
    name: custodia-tracker-simulator
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node backend/scripts/scheduled_fake_tracker_data.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: custodia-db
          property: connectionString
      - key: LOCATIONS_API_KEY
        value: abs123qwe

