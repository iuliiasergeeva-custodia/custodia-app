<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Custodia Animal Tracking</title>
    <meta name="description" content="Real-time animal tracking dashboard for wildlife conservation and livestock management.">
    
    <!-- Shared Styles -->
    <link rel="stylesheet" href="/static/styles/variables.css">
    <link rel="stylesheet" href="/static/styles/buttons.css">
    <link rel="stylesheet" href="/static/styles/forms.css">
    <link rel="stylesheet" href="/static/shared/layout.css">
    
    <!-- Dashboard Styles -->
    <link rel="stylesheet" href="/static/pages/dashboard/dashboard.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS for map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <!-- Header -->
    <header class="dashboard-header">
        <nav class="dashboard-nav">
            <div class="nav-container">
                <div class="nav-logo">
                    <a href="/">
                        <img src="/static/assets/images/custodia_logo_header_white.webp" alt="Custodia Logo" class="logo">
                        <span class="logo-text">Custodia</span>
                    </a>
                </div>
                <div class="nav-actions">
                    <div class="last-update">
                        <i class="fas fa-clock"></i>
                        <span id="lastUpdateTime">--</span>
                    </div>
                    <button class="btn btn-icon" id="downloadCsvBtn" title="Download CSV">
                        <i class="fas fa-download"></i>
                    </button>
                    <button class="btn btn-icon" id="refreshBtn" title="Refresh Data">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button class="btn btn-icon" id="logoutBtn" title="Logout" style="display: none;">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
                <div class="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Dashboard -->
    <main class="dashboard-main">
        <!-- Sidebar -->
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <h2>Tracked Animals</h2>
                <div class="animal-count">
                    <span id="animalCount">0</span> active
                </div>
            </div>
            
            <!-- Filters -->
            <div class="sidebar-filters-section">
                <div class="filters-header" id="filtersHeader">
                    <h3>Filters</h3>
                    <button type="button" class="filters-toggle-btn" id="filtersToggleBtn" title="Toggle filters">
                        <i class="fas fa-chevron-down" id="filtersToggleIcon"></i>
                    </button>
                </div>
                <div class="sidebar-filters" id="sidebarFilters" style="display: none;">
                    <div class="filter-group">
                    <div class="filter-group-header">
                        <label for="trackerFilter">Filter by Tracker</label>
                        <button type="button" id="toggleAllTrackers" class="toggle-all-btn" title="Toggle all trackers">
                            <span id="toggleAllText">Select All</span>
                        </button>
                    </div>
                    <div id="trackerFilter" class="tracker-filter-list">
                        <!-- Trackers will be populated by JavaScript -->
                    </div>
                </div>
                <div class="filter-group">
                    <label for="statusFilter">Filter by Status</label>
                    <select id="statusFilter" class="filter-select">
                        <option value="all">All Status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="alert">Alert</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="typeFilter">Filter by Animal Type</label>
                    <select id="typeFilter" class="filter-select">
                        <option value="all">All Types</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="familyFilter">Filter by Family</label>
                    <select id="familyFilter" class="filter-select">
                        <option value="all">All Families</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="dateFrom">Date From</label>
                    <input type="date" id="dateFrom" class="filter-select" />
                </div>
                <div class="filter-group">
                    <label for="dateTo">Date To</label>
                    <input type="date" id="dateTo" class="filter-select" />
                </div>
                <div class="filter-group">
                    <label for="visualizationMode">Visualization Mode</label>
                    <select id="visualizationMode" class="filter-select">
                        <option value="markers">Only Markers</option>
                        <option value="path">Show Path</option>
                        <option value="pathWithDirections">Show Path with Directions</option>
                    </select>
                </div>
                <div class="filter-group" id="showDistanceGroup" style="display: none;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="showDistanceCheckbox" class="filter-checkbox">
                        <span>Show distance between markers</span>
                    </label>
                </div>
                </div>
            </div>
            
            <!-- Animal List -->
            <div class="animal-list" id="animalList">
                <!-- Animal items will be inserted here by JavaScript -->
                <div class="animal-list-loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading animals...</p>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="dashboard-content">
            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <div class="stat-info">
                        <h3 class="stat-value" id="totalLocations">0</h3>
                        <p class="stat-label">Total Locations</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-info">
                        <h3 class="stat-value" id="avgUpdateTime">--</h3>
                        <p class="stat-label">Avg Update Time</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-battery-full"></i>
                    </div>
                    <div class="stat-info">
                        <h3 class="stat-value" id="avgBattery">--</h3>
                        <p class="stat-label">Avg Battery</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <div class="stat-info">
                        <h3 class="stat-value" id="alertsCount">0</h3>
                        <p class="stat-label">Active Alerts</p>
                    </div>
                </div>
            </div>

            <!-- Map Container -->
            <div class="map-container">
                <div id="map" class="map"></div>
                <div class="map-controls">
                    <button class="map-control-btn" id="zoomInBtn" title="Zoom In">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button class="map-control-btn" id="zoomOutBtn" title="Zoom Out">
                        <i class="fas fa-minus"></i>
                    </button>
                    <button class="map-control-btn" id="centerMapBtn" title="Center Map">
                        <i class="fas fa-crosshairs"></i>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Login/Signup Modal -->
    <div id="authModal" class="modal" style="display: block;">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h2 id="authModalTitle">Sign Up</h2>
                <button class="modal-close" id="closeAuthModal" aria-label="Close" style="display: none;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="authError" class="auth-error" style="display: none;"></div>
            <form id="authForm">
                <div id="clientSlugGroup" class="form-group" style="display: none;">
                    <label for="clientSlug">Client (optional)</label>
                    <input type="text" id="clientSlug" name="client_slug" class="form-input" placeholder="Leave empty for default client">
                </div>
                <div class="form-group" id="nameGroup">
                    <label for="authName">Name</label>
                    <input type="text" id="authName" name="name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="authEmail">Email</label>
                    <input type="email" id="authEmail" name="email" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="authPassword">Password</label>
                    <input type="password" id="authPassword" name="password" class="form-input" required minlength="6">
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary" id="authSubmitBtn">Sign Up</button>
                    <button type="button" class="btn btn-link" id="toggleAuthMode">Already have an account? Log in</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Tracker Modal -->
    <div id="editTrackerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Tracker</h2>
                <button class="modal-close" id="closeEditModal" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="editTrackerForm">
                <div class="form-group">
                    <label for="editAnimalName">Animal Name</label>
                    <input type="text" id="editAnimalName" name="animal_name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="editAnimalType">Animal Type</label>
                    <div class="dropdown-with-input">
                        <select id="editAnimalType" name="animal_type" class="form-select">
                            <option value="">Select or type new...</option>
                        </select>
                        <input type="text" id="editAnimalTypeNew" class="form-input" placeholder="Or type a new type..." style="display: none;">
                    </div>
                    <div class="form-group-actions">
                        <button type="button" class="btn-link" id="toggleTypeNew">+ Add New Type</button>
                        <button type="button" class="btn-link" id="manageTypesBtn">Manage Types</button>
                    </div>
                    <div id="typesList" class="options-list" style="display: none;">
                        <!-- Types with edit/delete buttons will be inserted here -->
                    </div>
                </div>
                <div class="form-group">
                    <label for="editFamily">Family</label>
                    <div class="dropdown-with-input">
                        <select id="editFamily" name="family" class="form-select">
                            <option value="">Select or type new...</option>
                        </select>
                        <input type="text" id="editFamilyNew" class="form-input" placeholder="Or type a new family..." style="display: none;">
                    </div>
                    <div class="form-group-actions">
                        <button type="button" class="btn-link" id="toggleFamilyNew">+ Add New Family</button>
                        <button type="button" class="btn-link" id="manageFamiliesBtn">Manage Families</button>
                    </div>
                    <div id="familiesList" class="options-list" style="display: none;">
                        <!-- Families with edit/delete buttons will be inserted here -->
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelEditModal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
                <input type="hidden" id="editTrackerId" name="tracker_id">
            </form>
        </div>
    </div>

    <!-- Leaflet JS for map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Dashboard Scripts -->
    <script src="/static/pages/dashboard/dashboard.js" defer></script>
</body>
</html>
