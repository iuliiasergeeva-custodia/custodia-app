<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Custodia Animal Tracking</title>
    <meta name="description" content="Real-time animal tracking dashboard for wildlife conservation and livestock management.">
    
    <!-- Favicon - Custodia Logo -->
    <link rel="icon" type="image/x-icon" href="/frontend/assets/images/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/frontend/assets/images/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="/frontend/assets/images/logo_tab.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/frontend/assets/images/favicon.ico">
    
    <!-- Shared Styles -->
    <link rel="stylesheet" href="/static/styles/variables.css">
    <link rel="stylesheet" href="/static/styles/buttons.css">
    <link rel="stylesheet" href="/static/styles/forms.css">
    <link rel="stylesheet" href="/static/shared/layout.css">
    
    <!-- Dashboard Styles -->
    <link rel="stylesheet" href="/static/pages/dashboard/dashboard.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS for map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <!-- Header -->
    <header class="dashboard-header">
        <nav class="dashboard-nav">
            <div class="nav-container">
                <div class="nav-logo">
                    <a href="/">
                        <img src="/static/assets/images/custodia_logo_header_white.webp" alt="Custodia Logo" class="logo">
                        <span class="logo-text">Custodia</span>
                    </a>
                </div>
                <div class="nav-center">
                    <div class="nav-center-group">
                        <div class="last-update">
                            <i class="fas fa-clock"></i>
                            <span id="lastUpdateTime">--</span>
                        </div>
                        <button class="btn btn-icon" id="downloadCsvBtn" title="Download CSV">
                            <i class="fas fa-download"></i>
                        </button>
                        <button class="btn btn-icon" id="refreshBtn" title="Refresh Data">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>
                <div class="nav-right">
                    <div id="userMenu" class="user-menu">
                        <span id="userEmail" class="user-email"></span>
                        <button type="button" class="btn btn-icon" id="logoutBtn" title="Log out">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>
                <div class="hamburger" id="dashboardHamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Dashboard -->
    <main class="dashboard-main">
        <!-- Sidebar (foldable) -->
        <aside class="dashboard-sidebar" id="dashboardSidebar" aria-expanded="true">
            <div class="sidebar-header">
                <span class="sidebar-header-title">
                    <i class="fas fa-broadcast-tower sidebar-header-icon" aria-hidden="true"></i>
                    <span class="sidebar-header-text">Trackers</span>
                    <span class="sidebar-count-pill" id="animalCount">0</span>
                </span>
                <button type="button" class="sidebar-fold-btn" id="sidebarFoldBtn" title="Collapse sidebar" aria-label="Collapse sidebar">
                    <i class="fas fa-chevron-left sidebar-fold-icon" aria-hidden="true"></i>
                </button>
            </div>

            <!-- Tracker cards list -->
            <div class="tracker-cards-list" id="animalList">
                <div class="animal-list-loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading trackers...</p>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="dashboard-content">
            <!-- Top bar: search, visualization mode, filters -->
            <div class="content-top-bar">
                <div class="search-trackers-wrap">
                    <i class="fas fa-search search-trackers-icon" aria-hidden="true"></i>
                    <input type="text" id="searchTrackersInput" class="search-trackers-input" placeholder="Search trackers..." autocomplete="off">
                </div>
                <div class="viz-mode-tabs" role="tablist">
                    <button type="button" class="viz-tab active" data-mode="markers" role="tab">Markers</button>
                    <button type="button" class="viz-tab" data-mode="path" role="tab">Path</button>
                    <button type="button" class="viz-tab" data-mode="pathWithDirections" role="tab">Movement (with arrows)</button>
                </div>
                <!-- Hidden select for map logic -->
                <select id="visualizationMode" class="visually-hidden" aria-hidden="true">
                    <option value="markers">Markers</option>
                    <option value="path">Path</option>
                    <option value="pathWithDirections">Movement (with arrows)</option>
                </select>
                <div class="filters-dropdown-wrap">
                    <button type="button" class="filters-dropdown-btn" id="filtersDropdownBtn" aria-expanded="false" aria-haspopup="true">
                        <span>Filters</span>
                        <i class="fas fa-chevron-down filters-dropdown-chevron" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <!-- Filters horizontal bar (drops down below top bar when Filters is open) -->
            <div id="filtersDropdownPanel" class="filters-horizontal-bar" hidden>
                <div class="filters-horizontal-row">
                    <div class="filter-field">
                        <label for="statusFilterBar">STATUS</label>
                        <select id="statusFilterBar" class="filter-select-bar">
                            <option value="all">All Status</option>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                            <option value="alert">Alert</option>
                        </select>
                    </div>
                    <div class="filter-field">
                        <label for="typeFilterBar">TYPE</label>
                        <select id="typeFilterBar" class="filter-select-bar">
                            <option value="all">All Types</option>
                        </select>
                    </div>
                    <div class="filter-field">
                        <label for="familyFilterBar">FAMILY</label>
                        <select id="familyFilterBar" class="filter-select-bar">
                            <option value="all">Any family</option>
                        </select>
                    </div>
                    <div class="filter-field">
                        <label for="dateFromBar">FROM</label>
                        <input type="date" id="dateFromBar" class="filter-select-bar" placeholder="dd/mm/yyyy">
                    </div>
                    <div class="filter-field">
                        <label for="dateToBar">TO</label>
                        <input type="date" id="dateToBar" class="filter-select-bar" placeholder="dd/mm/yyyy">
                    </div>
                    <div class="filter-field filter-field-toggle">
                        <label for="repeaterCoverageFilter">REPEATER COVERAGE</label>
                        <label class="filter-toggle-wrap" for="repeaterCoverageFilter">
                            <input type="checkbox" id="repeaterCoverageFilter" class="filter-toggle-input" aria-label="Show repeater coverage circles">
                            <span class="filter-toggle-track"></span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Map Container -->
            <div class="map-container">
                <div id="map" class="map"></div>
                <div class="map-controls">
                    <button class="map-control-btn" id="zoomInBtn" title="Zoom In">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button class="map-control-btn" id="zoomOutBtn" title="Zoom Out">
                        <i class="fas fa-minus"></i>
                    </button>
                    <button class="map-control-btn" id="centerMapBtn" title="Center Map">
                        <i class="fas fa-crosshairs"></i>
                    </button>
                </div>
                <!-- Tracker detail card overlay (shown when a tracker is selected) -->
                <div id="trackerDetailCard" class="tracker-detail-card" style="display: none;">
                    <div class="tracker-detail-header">
                        <div class="tracker-detail-title">
                            <span class="tracker-detail-name" id="detailCardName">--</span>
                            <span class="tracker-detail-sub" id="detailCardSub">--</span>
                        </div>
                        <div class="tracker-detail-actions">
                            <button type="button" class="btn-edit-tracker-detail" id="detailCardEditBtn" title="Edit Tracker">Edit Tracker</button>
                            <button type="button" class="tracker-detail-close" id="detailCardClose" aria-label="Close"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                    <div class="tracker-detail-grid">
                        <div class="tracker-detail-col">
                            <div class="tracker-detail-row"><span class="tracker-detail-label">TIME</span><span id="detailCardTime" class="tracker-detail-value">--</span></div>
                            <div class="tracker-detail-row"><span class="tracker-detail-label">DIST FROM PREV</span><span id="detailCardDistPrev" class="tracker-detail-value">--</span></div>
                            <div class="tracker-detail-row"><span class="tracker-detail-label">TOTAL DISTANCE</span><span id="detailCardTotalDist" class="tracker-detail-value">--</span></div>
                            <div class="tracker-detail-row"><span class="tracker-detail-label">COORDINATES</span><span id="detailCardCoords" class="tracker-detail-value">--</span></div>
                        </div>
                        <div class="tracker-detail-col">
                            <div class="tracker-detail-row"><span class="tracker-detail-label">BATTERY</span><span id="detailCardBattery" class="tracker-detail-value">--</span></div>
                            <div class="tracker-detail-row"><span class="tracker-detail-label">LOCATION</span><span id="detailCardLocation" class="tracker-detail-value">--</span></div>
                            <div class="tracker-detail-row"><span class="tracker-detail-label">AVG / DAY</span><span id="detailCardAvgDay" class="tracker-detail-value">--</span></div>
                            <div class="tracker-detail-row"><span class="tracker-detail-label">STATUS</span><span id="detailCardStatus" class="tracker-detail-status"></span></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Edit Tracker Modal -->
    <div id="editTrackerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Tracker</h2>
                <button class="modal-close" id="closeEditModal" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="editTrackerForm">
                <div class="modal-body">
                <div class="form-group">
                    <label for="editAnimalName">NAME</label>
                    <input type="text" id="editAnimalName" name="animal_name" class="form-input" required>
                </div>
                <div class="form-group">
                    <label for="editAnimalType">TYPE</label>
                    <div class="dropdown-with-input">
                        <select id="editAnimalType" name="animal_type" class="form-select">
                            <option value="">Select or type new...</option>
                        </select>
                        <input type="text" id="editAnimalTypeNew" class="form-input" placeholder="Or type a new type..." style="display: none;">
                    </div>
                    <div class="form-group-actions">
                        <button type="button" class="btn-link" id="toggleTypeNew">+ Add New Type</button>
                        <button type="button" class="btn-link" id="manageTypesBtn">Manage Types</button>
                    </div>
                    <div id="typesList" class="options-list" style="display: none;">
                        <!-- Types with edit/delete buttons will be inserted here -->
                    </div>
                </div>
                <div class="form-group">
                    <label for="editFamily">FAMILY</label>
                    <div class="dropdown-with-input">
                        <select id="editFamily" name="family" class="form-select">
                            <option value="">Select or type new...</option>
                        </select>
                        <input type="text" id="editFamilyNew" class="form-input" placeholder="Or type a new family..." style="display: none;">
                    </div>
                    <div class="form-group-actions">
                        <button type="button" class="btn-link" id="toggleFamilyNew">+ Add New Family</button>
                        <button type="button" class="btn-link" id="manageFamiliesBtn">Manage Families</button>
                    </div>
                    <div id="familiesList" class="options-list" style="display: none;">
                        <!-- Families with edit/delete buttons will be inserted here -->
                    </div>
                </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelEditModal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
                <input type="hidden" id="editTrackerId" name="tracker_id">
            </form>
        </div>
    </div>

    <!-- Leaflet JS for map -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Dashboard Scripts -->
    <script src="/static/pages/dashboard/dashboard.js" defer></script>
</body>
</html>
