<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password – Custodia</title>
    <link rel="icon" type="image/x-icon" href="/frontend/assets/images/favicon.ico">
    <link rel="stylesheet" href="/static/styles/variables.css">
    <link rel="stylesheet" href="/static/styles/forms.css">
    <link rel="stylesheet" href="/static/pages/auth/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <a href="/" class="auth-logo">Custodia</a>
            <h1>Forgot password</h1>
            <p>Enter your email and we’ll send you a reset link.</p>
        </div>
        <form id="forgotForm" class="auth-form" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@company.com">
            </div>
            <div id="forgotError" class="auth-error" role="alert" hidden></div>
            <div id="forgotSuccess" class="auth-success" role="status" hidden></div>
            <button type="submit" class="auth-submit" id="submitBtn">Send reset link</button>
        </form>
        <p class="auth-footer">
            <a href="/pages/auth/login">Back to log in</a>
        </p>
    </div>
    <script src="/static/pages/auth/forgot-password.js"></script>
</body>
</html>
