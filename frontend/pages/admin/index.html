<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custodia Admin</title>
    <link rel="icon" type="image/svg+xml" href="/frontend/assets/images/logo_tab.svg">
    <link rel="icon" type="image/x-icon" href="/frontend/assets/images/favicon.ico">
    <link rel="stylesheet" href="/frontend/pages/admin/admin.css">
</head>
<body>

<div class="adm-layout">

    <!-- Sidebar -->
    <aside class="adm-sidebar">
        <div class="adm-brand">
            <div class="adm-brand-icon">⚙</div>
            <span class="adm-brand-name">Admin</span>
            <span class="adm-brand-badge">root</span>
        </div>

        <div class="adm-sidebar-label">TOOLS</div>
        <nav class="adm-table-nav">
            <a href="/pages/admin/news" class="adm-table-nav-item">
                <span class="adm-table-dot" style="background:#3b82f6"></span>
                <span class="adm-table-name">News Editor</span>
            </a>
            <a href="/pages/admin/expenses" class="adm-table-nav-item">
                <span class="adm-table-dot" style="background:#22c55e"></span>
                <span class="adm-table-name">Expenses</span>
            </a>
        </nav>

        <div class="adm-sidebar-label">TABLES</div>
        <nav class="adm-table-nav" id="tableNav"></nav>

        <div class="adm-sidebar-footer">
            <div class="adm-api-key-row">
                <span class="adm-sidebar-label" style="margin:0">API KEY</span>
            </div>
            <div class="adm-api-key-display">
                <span class="adm-api-dots" id="apiKeyDots">••••••••••</span>
                <button class="adm-show-btn" id="showApiKeyBtn">Show</button>
            </div>
        </div>
    </aside>

    <!-- Main -->
    <main class="adm-main">
        <div class="adm-topbar">
            <div class="adm-topbar-left">
                <h1 class="adm-topbar-title" id="topbarTitle">—</h1>
                <span class="adm-topbar-meta" id="topbarMeta"></span>
            </div>
            <div class="adm-topbar-actions">
                <button class="adm-btn" id="refreshBtn">Refresh</button>
                <button class="adm-btn adm-btn-primary" id="newRecordBtn">+ New record</button>
            </div>
        </div>

        <div class="adm-content" id="admContent">
            <div class="adm-placeholder">
                <p>Select a table from the sidebar</p>
            </div>
        </div>
    </main>
</div>

<!-- Edit / New Record Modal -->
<div class="adm-modal" id="editModal" hidden>
    <div class="adm-modal-backdrop" id="modalBackdrop"></div>
    <div class="adm-modal-box">
        <div class="adm-modal-header">
            <h2 class="adm-modal-title" id="modalTitle">Edit record</h2>
            <button class="adm-modal-close" id="modalClose" aria-label="Close">✕</button>
        </div>
        <div class="adm-modal-body" id="modalBody"></div>
        <div class="adm-modal-footer">
            <button class="adm-btn" id="modalCancel">Cancel</button>
            <button class="adm-btn adm-btn-primary" id="modalSave">Save</button>
        </div>
    </div>
</div>

<script src="/frontend/pages/admin/admin.js" type="module"></script>
</body>
</html>
