<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Editor | Custodia Admin</title>
    <link rel="icon" type="image/svg+xml" href="/frontend/assets/images/logo_tab.svg">
    <link rel="icon" type="image/x-icon" href="/frontend/assets/images/favicon.ico">
    <link rel="stylesheet" href="/frontend/pages/admin/admin.css">
    <link rel="stylesheet" href="/frontend/pages/admin/news/news-admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="adm-layout">

    <!-- Sidebar -->
    <aside class="adm-sidebar">
        <div class="adm-brand">
            <div class="adm-brand-icon">⚙</div>
            <span class="adm-brand-name">Admin</span>
            <span class="adm-brand-badge">root</span>
        </div>

        <div class="adm-sidebar-label">SECTION</div>
        <nav class="adm-table-nav">
            <a href="/pages/admin" class="adm-table-nav-item">
                <span class="adm-table-dot" style="background:#f59e0b"></span>
                <span class="adm-table-name">Dashboard</span>
            </a>
            <a href="/pages/admin/news" class="adm-table-nav-item adm-table-nav-item--active">
                <span class="adm-table-dot" style="background:#3b82f6"></span>
                <span class="adm-table-name">News Editor</span>
            </a>
        </nav>

        <div class="adm-sidebar-footer">
            <button class="adm-btn" id="logoutBtn" style="width:100%;margin-top:auto">Logout</button>
        </div>
    </aside>

    <!-- Main -->
    <main class="adm-main">
        <div class="adm-topbar">
            <div class="adm-topbar-left">
                <h1 class="adm-topbar-title">News Editor</h1>
                <span class="adm-topbar-meta" id="topbarMeta"></span>
            </div>
            <div class="adm-topbar-actions">
                <button class="adm-btn adm-btn-primary" id="newPostBtn">+ New post</button>
            </div>
        </div>

        <div class="adm-content" id="admContent">

            <!-- Create / Edit Form -->
            <section class="news-section" id="postFormSection" style="display:none">
                <h2 class="news-section-title" id="formTitle">Create new post</h2>
                <form id="postForm" class="news-form">
                    <input type="hidden" id="postId">

                    <div class="news-field">
                        <label class="news-label" for="postTitle">Title <span class="news-required">*</span></label>
                        <input class="news-input" type="text" id="postTitle" required>
                    </div>

                    <div class="news-field">
                        <label class="news-label" for="postDate">Date</label>
                        <input class="news-input" type="datetime-local" id="postDate">
                    </div>

                    <div class="news-field">
                        <label class="news-label" for="postExcerpt">Excerpt</label>
                        <textarea class="news-input news-textarea" id="postExcerpt" rows="2" placeholder="Leave empty to auto-generate from content"></textarea>
                    </div>

                    <div class="news-field">
                        <label class="news-label" for="postContent">Content <span class="news-required">*</span></label>
                        <textarea class="news-input news-textarea" id="postContent" rows="10" required></textarea>
                    </div>

                    <div class="news-field">
                        <label class="news-label">Media files</label>
                        <div class="news-upload-area">
                            <input type="file" id="mediaFiles" multiple accept="image/*,video/*" style="display:none">
                            <label for="mediaFiles" class="adm-btn" style="cursor:pointer">
                                <i class="fas fa-upload"></i> Choose files
                            </label>
                            <span id="uploadProgress" style="display:none;margin-left:10px;color:var(--text-2)">
                                <i class="fas fa-spinner fa-spin"></i> Uploading…
                            </span>
                        </div>
                        <div id="uploadedMedia" class="news-media-grid"></div>
                    </div>

                    <div class="news-form-actions">
                        <button type="submit" class="adm-btn adm-btn-primary" id="saveBtn">Save post</button>
                        <button type="button" class="adm-btn" id="cancelBtn" style="display:none">Cancel</button>
                    </div>

                    <div id="formError" class="news-error" style="display:none"></div>
                    <div id="formSuccess" class="news-success" style="display:none"></div>
                </form>
            </section>

            <!-- Posts list -->
            <section class="news-section">
                <h2 class="news-section-title">All posts</h2>
                <div id="postsList" class="news-posts-list">
                    <div class="adm-placeholder"><p>Loading…</p></div>
                </div>
            </section>

        </div>
    </main>
</div>

<script src="/frontend/pages/admin/news/news-admin.js" type="module"></script>
</body>
</html>
